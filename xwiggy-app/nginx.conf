# Serves the built Angular app and reverse-proxies the backend's REST API under the same
# origin, so the browser never makes a cross-origin request in production (no CORS needed
# between browser and this container - only server-to-server, to the "backend" service).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The app itself uses hash-based routing (/#/menu, /#/checkout, ...), so the server
    # never sees Angular's client-side routes - this fallback only covers a direct hit on
    # a path that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Known backend REST endpoints (see xwiggy-back's controllers) - everything else stays
    # a static asset lookup above.
    location ~ ^/(login|register|api/register|checkUserName|contact|menu|order|orders|merchant|addToCart|addNewItem|addNewItemUrl|checkItemId)($|/) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
    }

    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
    }
}
