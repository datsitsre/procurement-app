<div class="dash">
  <aside class="dash-nav">
    <div class="dash-nav-mark">SpringFood</div>
    <nav>
      <a routerLink="/menu">Menu</a>
      <a routerLink="/myOrders">My orders</a>
      <a class="active">Contact us</a>
      <a routerLink="/home" (click)="clearLocal()">Log out</a>
    </nav>
  </aside>

  <main class="dash-main">
    <div class="contact-card">
      <h1>Contact us</h1>
      <div class="sub">send a message, we'll get back to you</div>

      <div *ngIf="message" class="notice error" role="alert">{{message}}</div>
      <div *ngIf="success" class="notice success">{{success}}</div>

      <form (ngSubmit)="sendFeedback()">
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" maxlength="6000" rows="6" [(ngModel)]="modelMessage.message"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="name">Your name</label>
            <input type="text" disabled id="name" name="name" placeholder="{{modelUser.firstname}} {{modelUser.lastname}}">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" disabled id="email" name="email" placeholder="{{modelUser.email}}">
          </div>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn btn-accent" [disabled]="sending">{{sending ? 'Sending…' : 'Send'}}</button>
          <button type="button" class="btn btn-ghost" [disabled]="sending" routerLink="/menu">Cancel</button>
        </div>
      </form>
    </div>
  </main>
</div>
