<div class="dash">
  <aside class="dash-nav">
    <div class="dash-nav-mark">SpringFood</div>
    <nav>
      <a routerLink="/menu">Menu</a>
      <a routerLink="/myOrders">My orders</a>
      <a routerLink="/contactUs">Contact us</a>
      <a routerLink="/home" (click)="clearLocal()">Log out</a>
    </nav>
  </aside>

  <main class="dash-main">
    <div class="checkout-card">
      <h1>Checkout</h1>
      <div class="sub">payment details</div>

      <div class="total-row">
        <span>To pay</span>
        <span class="price">{{total}}</span>
      </div>

      <hr class="rule">

      <div *ngIf="message" class="notice error" role="alert">{{message}}</div>

      <div class="field">
        <label>Card number</label>
        <input type="text" class="num" placeholder="xxxx xxxx xxxx xxxx"
               minlength="16"
               maxlength="16"
               [(ngModel)]="cardNumber"
               name="cardNumber"
               required
               (keyup)="validCard()">
      </div>

      <div class="field-row">
        <div class="field">
          <label>Expiry month</label>
          <input type="number" class="num" placeholder="MM" min="1" max="12" required [(ngModel)]="month" name="month" (keyup)="validMonth()">
        </div>
        <div class="field">
          <label>Expiry year</label>
          <input type="number" class="num" placeholder="YY" min="19" max="99" required [(ngModel)]="year" name="year" (keyup)="validYear()">
        </div>
        <div class="field">
          <label>CVV</label>
          <input type="number" class="num" placeholder="CVV" min="100" max="999" required [(ngModel)]="cvv" name="cvv" (keyup)="validCvv()">
        </div>
      </div>

      <div class="field">
        <label>Cardholder name</label>
        <input type="text" placeholder="name on card" required minlength="4" maxlength="10" [(ngModel)]="nameOnCard" name="nameOnCard" (keyup)="validName()">
      </div>

      <div class="btn-row">
        <button type="button" class="btn btn-accent" [disabled]="paying" (click)="changeDB()">{{paying ? 'Paying…' : 'Pay'}}</button>
        <button class="btn btn-ghost" [attr.disabled]="paying ? true : null" routerLink="/menu">Go back</button>
      </div>
    </div>
  </main>
</div>
