# Production values come entirely from the environment - nothing here has a fallback default,
# so the app refuses to start rather than silently running with a dev secret or open CORS.
# See docker-compose.yml / .env.example for how these are supplied.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

fileStorage=${FILE_STORAGE_PATH:/data/assets}

logging.level.com.xwiggy.food=INFO
logging.level.org.springframework.web=WARN
