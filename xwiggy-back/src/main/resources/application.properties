# Common, profile-independent defaults. Environment-specific values (datasource, secrets,
# CORS origins) live in application-dev.properties / application-prod.properties - select
# one with SPRING_PROFILES_ACTIVE (defaults to dev for local work; docker-compose sets prod).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT token lifetime in ms (24h). The signing secret itself is per-profile - see below.
jwt.expirationMs=86400000

# Actuator: expose health/info only by default (see SecurityConfig for what's public)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
