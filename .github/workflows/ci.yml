name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: myusers
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Load schema + seed data
        run: mysql -h 127.0.0.1 -u root myusers < docker/mysql-init/init.sql

      - name: Build and test
        working-directory: xwiggy-back
        run: mvn -B -DskipTests=false clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: xwiggy-app/package-lock.json

      - name: Install dependencies
        working-directory: xwiggy-app
        run: npm ci

      - name: Build
        working-directory: xwiggy-app
        run: npx ng build

      # Unit tests aren't run here yet - the generated spec files are still placeholders
      # (see xwiggy-app/src/app/*.spec.ts). Add `ng test --watch=false --browsers=ChromeHeadless`
      # once there's real coverage worth gating merges on.

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t xwiggy-back ./xwiggy-back
      - name: Build frontend image
        run: docker build -t xwiggy-app ./xwiggy-app
